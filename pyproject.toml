[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wiki_guard --cov=wiki_guard_lib --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
files = [".claude/bin", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
